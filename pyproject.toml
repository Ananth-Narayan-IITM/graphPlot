[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphPlot"
version = "2.0.0.dev0"
description = "Compact publication-quality figures from OpenFOAM VTP and tabular data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Ananth Narayan" }]
keywords = ["CFD", "OpenFOAM", "VTP", "contour", "matplotlib", "publication", "PDF_TeX"]

dependencies = [
    "numpy>=1.23",
    "matplotlib>=3.7",
    "pyvista>=0.43",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.5",
]

[project.scripts]
graphplot = "graphplot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pyvista.*",
    "ignore::DeprecationWarning:vtk.*",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [".git", ".venv", "build", "dist", "docs", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PTH"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
