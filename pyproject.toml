[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "graphPlot"
version = "0.1.0"
description = "Publication-quality scientific post-processing and visualization"
requires-python = ">=3.8"

dependencies = [
    "numpy",
    "matplotlib",
    "pyvista",
    "pyyaml",
]

[tool.setuptools.packages.find]
where = ["src"]